<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigSplit</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#6366f1;--primary2:#8b5cf6;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--shadow:0 12px 30px rgba(17,24,39,.08);--radius:22px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 260px);color:var(--ink);padding:18px 16px 92px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}h1{font-size:34px;line-height:1;margin:0 0 6px;font-weight:850;letter-spacing:-1.2px}.sub{color:var(--muted);font-size:14px}.pill{background:rgba(99,102,241,.1);color:var(--primary);border:1px solid rgba(99,102,241,.16);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid rgba(229,231,235,.9);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.stat .value{font-size:26px;font-weight:850;margin-top:6px;letter-spacing:-.5px}.section-title{margin:22px 2px 10px;color:#374151;font-size:14px;font-weight:800}
.gig{display:flex;gap:12px;align-items:center;margin-bottom:10px}.datebox{width:58px;min-width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:850}.datebox .m{font-size:11px;text-transform:uppercase;opacity:.9}.datebox .d{font-size:22px;line-height:1}.gig-main{flex:1;min-width:0}.gig-title{font-weight:850;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gig-meta{font-size:13px;color:var(--muted);margin-top:3px}.status{font-size:12px;padding:6px 9px;border-radius:999px;font-weight:800;white-space:nowrap}.confirmed{background:rgba(34,197,94,.12);color:#15803d}.awaiting{background:rgba(245,158,11,.14);color:#b45309}.cancelled{background:rgba(239,68,68,.12);color:#b91c1c}
.form{display:grid;gap:10px}input,select,textarea{width:100%;border:1px solid var(--line);background:white;color:var(--ink);border-radius:16px;padding:13px 14px;font:inherit;outline:none}textarea{min-height:84px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.12)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:13px 16px;font-weight:850;cursor:pointer;font-size:15px}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.btn.bad{background:rgba(239,68,68,.1);color:var(--bad);border:1px solid rgba(239,68,68,.25)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.list-empty{color:var(--muted);text-align:center;padding:26px 12px}
.nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:999;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border:1px solid rgba(229,231,235,.9);border-radius:24px;padding:8px;box-shadow:0 18px 45px rgba(17,24,39,.18)}.nav button{border:0;background:transparent;border-radius:18px;padding:9px 4px;color:var(--muted);font-weight:800;font-size:11px}.nav button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white}
.money-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.money-line:last-child{border-bottom:0}.small{font-size:13px;color:var(--muted)}.avail{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.avail:last-child{border-bottom:0}.toggle{border:1px solid var(--line);background:white;border-radius:12px;padding:8px 10px;font-weight:850}.toggle.on.good{background:rgba(34,197,94,.12);color:#15803d}.toggle.on.bad{background:rgba(239,68,68,.12);color:#b91c1c}.toggle.on.warn{background:rgba(245,158,11,.14);color:#b45309}
@media(min-width:760px){body{max-width:980px;margin:0 auto;padding-bottom:110px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><div><h1>GigSplit</h1><div class="sub">Gigs, money, availability and notes.</div></div><div class="pill" id="nextPill">No gigs</div></header>
<main>
<section id="dashboard" class="page active"><div class="grid"><div class="card stat"><div class="label">Upcoming</div><div class="value" id="statUpcoming">0</div></div><div class="card stat"><div class="label">This month</div><div class="value" id="statMonth">£0</div></div><div class="card stat"><div class="label">Outstanding</div><div class="value" id="statOwed">£0</div></div><div class="card stat"><div class="label">Confirmed</div><div class="value" id="statConfirmed">0</div></div></div><div class="section-title">Next gigs</div><div id="nextGigs"></div></section>
<section id="gigs" class="page"><div class="card"><div class="form"><input id="gigTitle" placeholder="Gig name / event"><div class="row"><input id="gigDate" type="date"><input id="gigTime" type="time"></div><input id="gigVenue" placeholder="Venue"><input id="gigAddress" placeholder="Address / postcode"><div class="row"><input id="gigFee" type="number" step="0.01" placeholder="Fee £"><input id="gigDeposit" type="number" step="0.01" placeholder="Deposit paid £"></div><select id="gigStatus"><option value="confirmed">Confirmed</option><option value="awaiting">Awaiting reply</option><option value="cancelled">Cancelled</option></select><textarea id="gigNotes" placeholder="Load-in, parking, contact, set notes..."></textarea><button class="btn primary" onclick="saveGig()" id="saveGigBtn">Add gig</button><button class="btn ghost" onclick="resetForm()" id="cancelEditBtn" style="display:none">Cancel edit</button></div></div><div class="section-title">All gigs</div><div id="allGigs"></div></section>
<section id="venues" class="page"><div class="section-title">Venues</div><div id="venueList"></div></section>
<section id="money" class="page"><div class="card"><div class="money-line"><strong>Total booked</strong><strong id="moneyBooked">£0</strong></div><div class="money-line"><strong>Deposits paid</strong><strong id="moneyDeposit">£0</strong></div><div class="money-line"><strong>Still owed</strong><strong id="moneyOwed">£0</strong></div></div><div class="section-title">Gig payments</div><div id="moneyList"></div></section>
<section id="settings" class="page"><div class="card"><div class="section-title" style="margin-top:0">Band members</div><div id="membersList"></div><div class="row"><input id="memberName" placeholder="Add member"><button class="btn ghost" onclick="addMember()">Add</button></div></div><div class="card" style="margin-top:12px"><div class="section-title" style="margin-top:0">Backup</div><div class="actions"><button class="btn ghost" onclick="exportData()">Export</button><label class="btn ghost" style="text-align:center">Import<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div></div></section>
</main>
<nav class="nav"><button onclick="showPage('dashboard',this)" class="active">Home</button><button onclick="showPage('gigs',this)">Gigs</button><button onclick="showPage('venues',this)">Venues</button><button onclick="showPage('money',this)">Money</button><button onclick="showPage('settings',this)">Settings</button></nav>
<script>
const DEFAULT={members:["Steve","Other Steve"],gigs:[{id:"demo-1",title:"Blue Bell",date:"2026-07-03",time:"20:30",venue:"Blue Bell, Conwy",address:"Conwy",fee:250,deposit:50,status:"confirmed",notes:"Load in 7:45. Duo set.",availability:{}},{id:"demo-2",title:"Conwy Comrades Club",date:"2026-07-19",time:"20:30",venue:"Conwy Comrades Club",address:"Conwy",fee:300,deposit:0,status:"awaiting",notes:"Confirm poster and arrival time.",availability:{}}]};let data=JSON.parse(localStorage.getItem("gigsplit_data")||"null")||DEFAULT;let editingId=null;
function save(){localStorage.setItem("gigsplit_data",JSON.stringify(data));render()}function money(n){return"£"+(Number(n)||0).toFixed(2).replace(/\.00$/,"")}function dateObj(g){return new Date(g.date+"T"+(g.time||"00:00"))}function futureGigs(){const now=new Date();now.setHours(0,0,0,0);return data.gigs.filter(g=>dateObj(g)>=now).sort((a,b)=>dateObj(a)-dateObj(b))}function statusClass(s){return s==="confirmed"?"confirmed":s==="cancelled"?"cancelled":"awaiting"}function statusLabel(s){return s==="confirmed"?"Confirmed":s==="cancelled"?"Cancelled":"Awaiting"}function fmtDate(g){return dateObj(g).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}function monthShort(g){return dateObj(g).toLocaleDateString("en-GB",{month:"short"})}function dayNum(g){return dateObj(g).getDate()}
function showPage(id,btn){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render()}
function gigCard(g,editable=false){return `<div class="card gig"><div class="datebox"><div class="m">${monthShort(g)}</div><div class="d">${dayNum(g)}</div></div><div class="gig-main"><div class="gig-title">${g.title||"Untitled gig"}</div><div class="gig-meta">${fmtDate(g)} ${g.time||""} · ${g.venue||"No venue"} · ${money(g.fee)}</div></div><div><div class="status ${statusClass(g.status)}">${statusLabel(g.status)}</div>${editable?`<button class="btn ghost" style="margin-top:8px;padding:8px 10px;font-size:12px" onclick="editGig('${g.id}')">Edit</button>`:""}</div></div>`}
function render(){const upcoming=futureGigs(),m=new Date().getMonth(),y=new Date().getFullYear();const thisMonth=data.gigs.filter(g=>{const d=dateObj(g);return d.getMonth()===m&&d.getFullYear()===y&&g.status!=="cancelled"});const totalMonth=thisMonth.reduce((s,g)=>s+(Number(g.fee)||0),0);const owed=data.gigs.filter(g=>g.status!=="cancelled").reduce((s,g)=>s+((Number(g.fee)||0)-(Number(g.deposit)||0)),0);statUpcoming.textContent=upcoming.length;statMonth.textContent=money(totalMonth);statOwed.textContent=money(owed);statConfirmed.textContent=data.gigs.filter(g=>g.status==="confirmed").length;nextPill.textContent=upcoming[0]?`Next: ${upcoming[0].title}`:"No gigs";nextGigs.innerHTML=upcoming.slice(0,4).map(g=>gigCard(g)).join("")||`<div class="card list-empty">No upcoming gigs yet.</div>`;allGigs.innerHTML=[...data.gigs].sort((a,b)=>dateObj(a)-dateObj(b)).map(g=>gigCard(g,true)+availabilityBlock(g)).join("")||`<div class="card list-empty">No gigs yet.</div>`;renderVenues();renderMoney();renderMembers()}
function availabilityBlock(g){return `<div class="card" style="margin-top:-2px;margin-bottom:12px"><div class="small" style="margin-bottom:6px">Availability</div>${data.members.map(m=>{const val=(g.availability||{})[m]||"";return `<div class="avail"><strong>${m}</strong><button class="toggle ${val==="yes"?"on good":""}" onclick="setAvail('${g.id}','${m}','yes')">✓</button><button class="toggle ${val==="no"?"on bad":""}" onclick="setAvail('${g.id}','${m}','no')">✕</button><button class="toggle ${val==="maybe"?"on warn":""}" onclick="setAvail('${g.id}','${m}','maybe')">?</button></div>`}).join("")}</div>`}
function setAvail(id,member,val){const g=data.gigs.find(x=>x.id===id);if(!g)return;g.availability=g.availability||{};g.availability[member]=g.availability[member]===val?"":val;save()}
function saveGig(){const g={id:editingId||"gig-"+Date.now(),title:gigTitle.value.trim(),date:gigDate.value,time:gigTime.value,venue:gigVenue.value.trim(),address:gigAddress.value.trim(),fee:parseFloat(gigFee.value)||0,deposit:parseFloat(gigDeposit.value)||0,status:gigStatus.value,notes:gigNotes.value.trim(),availability:editingId?(data.gigs.find(x=>x.id===editingId)?.availability||{}):{}};if(!g.title||!g.date){alert("Add at least a gig name and date.");return}if(editingId){data.gigs=data.gigs.map(x=>x.id===editingId?g:x)}else data.gigs.push(g);resetForm();save()}
function editGig(id){const g=data.gigs.find(x=>x.id===id);if(!g)return;editingId=id;gigTitle.value=g.title;gigDate.value=g.date;gigTime.value=g.time||"";gigVenue.value=g.venue||"";gigAddress.value=g.address||"";gigFee.value=g.fee||"";gigDeposit.value=g.deposit||"";gigStatus.value=g.status||"confirmed";gigNotes.value=g.notes||"";saveGigBtn.textContent="Save gig";cancelEditBtn.style.display="block";window.scrollTo({top:0,behavior:"smooth"})}
function resetForm(){editingId=null;["gigTitle","gigDate","gigTime","gigVenue","gigAddress","gigFee","gigDeposit","gigNotes"].forEach(id=>document.getElementById(id).value="");gigStatus.value="confirmed";saveGigBtn.textContent="Add gig";cancelEditBtn.style.display="none"}
function renderVenues(){const venues={};data.gigs.forEach(g=>{const key=g.venue||"No venue";if(!venues[key])venues[key]={count:0,total:0,address:g.address||""};venues[key].count++;venues[key].total+=Number(g.fee)||0});venueList.innerHTML=Object.entries(venues).map(([v,x])=>`<div class="card" style="margin-bottom:10px"><div class="gig-title">${v}</div><div class="gig-meta">${x.count} gig(s) · ${money(x.total)} total</div><div class="small" style="margin-top:8px">${x.address||""}</div></div>`).join("")||`<div class="card list-empty">Venues appear after you add gigs.</div>`}
function renderMoney(){const active=data.gigs.filter(g=>g.status!=="cancelled"),booked=active.reduce((s,g)=>s+(Number(g.fee)||0),0),dep=active.reduce((s,g)=>s+(Number(g.deposit)||0),0);moneyBooked.textContent=money(booked);moneyDeposit.textContent=money(dep);moneyOwed.textContent=money(booked-dep);moneyList.innerHTML=active.sort((a,b)=>dateObj(a)-dateObj(b)).map(g=>`<div class="card" style="margin-bottom:10px"><div class="gig-title">${g.title}</div><div class="gig-meta">${fmtDate(g)} · ${g.venue}</div><div class="money-line"><span>Fee</span><strong>${money(g.fee)}</strong></div><div class="money-line"><span>Deposit</span><strong>${money(g.deposit)}</strong></div><div class="money-line"><span>Balance</span><strong>${money((Number(g.fee)||0)-(Number(g.deposit)||0))}</strong></div></div>`).join("")||`<div class="card list-empty">No payment data yet.</div>`}
function renderMembers(){membersList.innerHTML=data.members.map(m=>`<div class="money-line"><span>${m}</span><button class="btn bad" style="padding:7px 10px;font-size:12px" onclick="removeMember('${m}')">Remove</button></div>`).join("")}
function addMember(){const m=memberName.value.trim();if(!m)return;if(!data.members.includes(m))data.members.push(m);memberName.value="";save()}
function removeMember(m){data.members=data.members.filter(x=>x!==m);data.gigs.forEach(g=>{if(g.availability)delete g.availability[m]});save()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gigsplit-backup.json";a.click()}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert("Imported.")}catch{alert("Could not import file.")}};r.readAsText(file)}
if("serviceWorker"in navigator){navigator.serviceWorker.register("service-worker.js").catch(()=>{})}render();
</script></body></html>
